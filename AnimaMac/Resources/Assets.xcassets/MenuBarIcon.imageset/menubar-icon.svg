<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <!-- Cute red panda - stroke-based menu bar template icon -->
  <g fill="none" stroke="black" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rounded ears (bigger, rounder = cuter) -->
    <circle cx="7" cy="7" r="2.8"/>
    <circle cx="15" cy="7" r="2.8"/>
    <!-- Inner ears -->
    <circle cx="7" cy="7" r="1.3"/>
    <circle cx="15" cy="7" r="1.3"/>
    <!-- Chubby round head -->
    <ellipse cx="11" cy="13.5" rx="7" ry="6.5"/>
    <!-- Big round cheeks (puffed out) -->
    <path d="M4.5 14.5 Q4 13 5 12"/>
    <path d="M17.5 14.5 Q18 13 17 12"/>
  </g>
  <!-- Big sparkly eyes (larger = cuter) -->
  <circle cx="8.5" cy="12.5" r="1.4" fill="black"/>
  <circle cx="13.5" cy="12.5" r="1.4" fill="black"/>
  <!-- Eye shine (top-right sparkle) -->
  <circle cx="9.1" cy="11.9" r="0.5" fill="white"/>
  <circle cx="14.1" cy="11.9" r="0.5" fill="white"/>
  <!-- Tiny triangle nose -->
  <path d="M10.5 15.2 L11 14.6 L11.5 15.2 Z" fill="black"/>
  <!-- Little smile -->
  <path d="M9.8 16 Q11 17 12.2 16" stroke="black" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- Blush marks (tiny lines on cheeks) -->
  <g stroke="black" stroke-width="0.8" stroke-linecap="round">
    <line x1="5.5" y1="14" x2="6.5" y2="14"/>
    <line x1="5.2" y1="14.8" x2="6.2" y2="14.8"/>
    <line x1="15.5" y1="14" x2="16.5" y2="14"/>
    <line x1="15.8" y1="14.8" x2="16.8" y2="14.8"/>
  </g>
</svg>
