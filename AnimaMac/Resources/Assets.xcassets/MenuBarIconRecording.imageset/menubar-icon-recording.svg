<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <!-- Cute red panda - recording state (excited!) -->
  <g fill="none" stroke="black" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rounded ears -->
    <circle cx="7" cy="7" r="2.8"/>
    <circle cx="15" cy="7" r="2.8"/>
    <!-- Inner ears -->
    <circle cx="7" cy="7" r="1.3"/>
    <circle cx="15" cy="7" r="1.3"/>
    <!-- Chubby round head -->
    <ellipse cx="11" cy="13.5" rx="7" ry="6.5"/>
    <!-- Cheek puffs -->
    <path d="M4.5 14.5 Q4 13 5 12"/>
    <path d="M17.5 14.5 Q18 13 17 12"/>
  </g>
  <!-- Extra big excited eyes -->
  <circle cx="8.5" cy="12.2" r="1.6" fill="black"/>
  <circle cx="13.5" cy="12.2" r="1.6" fill="black"/>
  <!-- Big sparkly eye shine -->
  <circle cx="9.2" cy="11.5" r="0.6" fill="white"/>
  <circle cx="14.2" cy="11.5" r="0.6" fill="white"/>
  <circle cx="8.2" cy="12.8" r="0.3" fill="white"/>
  <circle cx="13.2" cy="12.8" r="0.3" fill="white"/>
  <!-- Tiny triangle nose -->
  <path d="M10.5 14.8 L11 14.2 L11.5 14.8 Z" fill="black"/>
  <!-- Excited open mouth -->
  <ellipse cx="11" cy="16.3" rx="1.5" ry="1" stroke="black" stroke-width="1.2" fill="none"/>
  <!-- Blush marks -->
  <g stroke="black" stroke-width="0.8" stroke-linecap="round">
    <line x1="5.5" y1="14" x2="6.5" y2="14"/>
    <line x1="5.2" y1="14.8" x2="6.2" y2="14.8"/>
    <line x1="15.5" y1="14" x2="16.5" y2="14"/>
    <line x1="15.8" y1="14.8" x2="16.8" y2="14.8"/>
  </g>
  <!-- Recording dot -->
  <circle cx="17.5" cy="4.5" r="2" fill="black"/>
</svg>
