<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18">
  <!-- Red Panda face - recording state (wide eyes, open mouth) -->
  <!-- Left ear -->
  <ellipse cx="4.5" cy="3.5" rx="2.8" ry="3" fill="black"/>
  <!-- Right ear -->
  <ellipse cx="13.5" cy="3.5" rx="2.8" ry="3" fill="black"/>
  <!-- Inner left ear -->
  <ellipse cx="4.5" cy="3.5" rx="1.5" ry="1.6" fill="white"/>
  <!-- Inner right ear -->
  <ellipse cx="13.5" cy="3.5" rx="1.5" ry="1.6" fill="white"/>
  <!-- Head -->
  <ellipse cx="9" cy="10" rx="6.5" ry="6" fill="black"/>
  <!-- Face (lighter area) -->
  <ellipse cx="9" cy="10.5" rx="5" ry="4.8" fill="white"/>
  <!-- Cheek marks - left -->
  <ellipse cx="5.5" cy="10" rx="1.8" ry="1.2" fill="black" opacity="0.5"/>
  <!-- Cheek marks - right -->
  <ellipse cx="12.5" cy="10" rx="1.8" ry="1.2" fill="black" opacity="0.5"/>
  <!-- Left eye - wider/excited -->
  <ellipse cx="6.8" cy="8.8" rx="1.2" ry="1.3" fill="black"/>
  <!-- Right eye - wider/excited -->
  <ellipse cx="11.2" cy="8.8" rx="1.2" ry="1.3" fill="black"/>
  <!-- Eye shine left - bigger -->
  <circle cx="7.2" cy="8.3" r="0.45" fill="white"/>
  <!-- Eye shine right - bigger -->
  <circle cx="11.6" cy="8.3" r="0.45" fill="white"/>
  <!-- Nose -->
  <ellipse cx="9" cy="11.3" rx="0.8" ry="0.6" fill="black"/>
  <!-- Open mouth (recording!) -->
  <ellipse cx="9" cy="12.8" rx="1.2" ry="0.9" fill="black"/>
  <!-- Recording dot on right ear -->
  <circle cx="14.5" cy="1.5" r="1.5" fill="black"/>
</svg>
